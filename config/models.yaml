# ---------------------------------------------------------------------------
# MODEL FALLBACK CHAINS
# ---------------------------------------------------------------------------
# Each task has an ordered list of models. The system tries the first one; if
# it is rate-limited, unavailable, or errors, it moves to the next. A task only
# fails if EVERY model in its chain fails.
#
# IMPORTANT: if a model name is wrong the system will skip it and move on
# (you will see this in the run log). Run `python verify_models.py` to get the
# exact list of model names your API key can actually see, then correct this
# file.
#
# rpm = requests per minute, rpd = requests per day (free tier limits).
#
# THESE LIMITS ARE PER KEY, PER DAY. With two keys from two different Google
# Cloud projects the quotas are genuinely separate, so the real daily capacity
# is double what is written below. Usage is tracked per key in data/quota.json
# and persists across runs -- see src/quota.py for why that matters.
#
# NOTE: there must be exactly ONE `chains:` block in this file. YAML silently
# keeps only the last of a duplicated key, so a second block would delete every
# chain above it.
# ---------------------------------------------------------------------------

limits:
  # Cheap, high-volume models. These do the bulk of the work.
  gemini-3.1-flash-lite:   {rpm: 15, rpd: 500}
  gemini-3.5-flash-lite:   {rpm: 15, rpd: 500}

  # "Deep" models. Only 20 requests per day EACH, so they are reserved for
  # judgement calls, never for bulk reading.
  gemini-3.7-flash:        {rpm: 5,  rpd: 20}
  gemini-3.6-flash:        {rpm: 5,  rpd: 20}
  gemini-3.5-flash:        {rpm: 5,  rpd: 20}
  gemini-3-flash-preview:  {rpm: 5,  rpd: 20}

  # Embeddings, used for similarity checks. Very generous limits.
  gemini-embedding-001:    {rpm: 100, rpd: 1000}

  # Gemma has an enormous REQUEST budget but a small TOKEN budget
  # (16K tokens/minute), which makes it useless for reading newspapers and
  # perfectly adequate for a one-question screen. Kept as an overflow tier so
  # the daily screen can never be the thing that exhausts your quota.
  gemma-4-31b-it:          {rpm: 30, rpd: 14400}

  # Aliases that always point at whatever is current. Used as the last entry in
  # each chain so a task can survive future model renames.
  gemini-flash-latest:      {rpm: 5,  rpd: 20}
  gemini-flash-lite-latest: {rpm: 15, rpd: 500}

# Which models count as "deep" for the generation reserve. Forecasting may not
# draw these below settings.run.deep_reserve_for_generation.
deep_models:
  - gemini-3.7-flash
  - gemini-3.6-flash
  - gemini-3.5-flash
  - gemini-3-flash-preview
  - gemini-flash-latest

# Tasks belonging to the forecasting layer. Used only to enforce the reserve,
# so a heavy forecasting day can never silently degrade question generation.
forecast_tasks:
  - shape
  - screen
  - confirm
  - lens_outside
  - lens_inside
  - lens_reconcile
  - lens_audit
  - advocate

# Only these can perform Google Search grounding on the free tier. Gemini 3
# models show a grounding quota of ZERO, so asking them to search returns a
# perfectly normal-looking UNGROUNDED answer -- which would give us a reference
# entry marked "verified" that was never verified. The router refuses to use a
# non-grounding model for a grounded call, and every grounded response reports
# whether grounding actually fired (see models._post).
# EMPTY AFTER THE FIRST LIVE RUN. Both 2.5-family models returned HTTP 404 for
# both keys -- they do not exist for this account at all, so the grounding
# question was never actually tested. Because they were the ONLY grounding
# models, every lens_outside call wasted its first attempt discovering there
# was nothing to ground with, then succeeded ungrounded on the retry.
#
# The router now checks this list at startup and turns grounding off for the
# whole run if it is empty or unreachable, instead of failing per call.
#
# If a grounding-capable model becomes available, add it here and set
# reference.verify_with_grounding back to true in settings.yaml.
grounding_models: []
_grounding_models_disabled:

chains:
  # ---- stage one: question generation ------------------------------------

  # Reading pages and pulling out macro-relevant articles. High volume, low
  # difficulty -> cheap models first, deep models only as an emergency backstop.
  triage:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-3-flash-preview
    - gemini-flash-lite-latest

  # Agents proposing questions. Moderate volume, moderate difficulty.
  propose:
    - gemini-3.1-flash-lite
    - gemini-3.5-flash-lite
    - gemini-3-flash-preview
    - gemini-3.5-flash
    - gemini-flash-lite-latest

  # Judging a system's proposals against the gates and picking a winner.
  # This is the most important judgement in the pipeline, so it gets the
  # deep models first -- and the deep reserve exists to protect it.
  contest:
    - gemini-3.7-flash
    - gemini-3.6-flash
    - gemini-3.5-flash
    - gemini-3-flash-preview
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-flash-latest

  # Portfolio-level checks: linked-answer duplicates, tag assignment.
  gate:
    - gemini-3.5-flash
    - gemini-3-flash-preview
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-flash-latest

  # Matching a proposed tag against existing lexicon entries.
  lexicon:
    - gemini-3.1-flash-lite
    - gemini-3.5-flash-lite

  embed:
    - gemini-embedding-001

  # ---- stage two: forecasting --------------------------------------------

  # One-off classification of a question as window or point. Cheap, once per
  # question, but it decides whether scope sensitivity is exercised at all.
  shape:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-flash-lite-latest

  # The merged daily screen: does anything bear on this question, AND did it
  # resolve? One call per question per run, so it must be cheap.
  screen:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemma-4-31b-it
    - gemini-flash-lite-latest

  # Confirming a resolution. A wrong resolution corrupts the record
  # permanently, so this gets better models -- but it only fires on
  # nominations, which is a handful of days a year.
  confirm:
    - gemini-3.5-flash
    - gemini-3-flash-preview
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite

  # Building the base rate. Grounding-capable models first, so enumerated
  # historical cases can be verified where the free tier allows it.
  lens_outside:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-flash-lite-latest

  # The two one-sided cases. Highest volume in the system: two calls per lens
  # per question per refresh.
  lens_inside:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
    - gemini-flash-lite-latest

  # Reconciliation produces the actual number, so it is worth a little more.
  lens_reconcile:
    - gemini-3.1-flash-lite
    - gemini-3.5-flash-lite
    - gemini-flash-lite-latest

  # The blind contamination audit. Listed so the first choice differs from
  # lens_reconcile's first choice: an auditor that is the same model that wrote
  # the reasoning is a weaker check.
  lens_audit:
    - gemini-3.5-flash-lite
    - gemma-4-31b-it
    - gemini-3.1-flash-lite
    - gemini-flash-lite-latest

  # Devil's advocate on the aggregate. One per question, so deep models are
  # affordable here -- subject to the generation reserve.
  advocate:
    - gemini-3.5-flash
    - gemini-3-flash-preview
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
